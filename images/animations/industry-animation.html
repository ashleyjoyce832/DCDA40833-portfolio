<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry Experience Animation</title>
    <style>
        :root {
            --ink: #111111;
            --c1: #7fc8f8;
            --c2: #ff9ec4;
            --c3: #ffb347;
            --c4: #c7a4ff;
            --c5: #8ad6a2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fefefe 0%, #f2f4f8 100%);
        }

        .animation-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 0.8rem;
            background: transparent;
        }

        .animation-frame {
            width: 320px;
            height: 320px;
            border-radius: 28px;
            background: #ffffff;
            border: 1px solid #edf1f5;
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        .animation-frame::before {
            content: "";
            position: absolute;
            inset: 18px;
            border-radius: 22px;
            border: 1px dashed #e6ebf0;
        }

        .industry-icons {
            width: 220px;
            height: 220px;
            position: relative;
            z-index: 1;
        }

        .icon {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateY(8px) scale(0.92);
            animation: iconFlow 15s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }

        /* Stethoscope - appears first */
        .icon:nth-child(1) {
            animation-delay: 0s;
            color: var(--c1);
        }

        /* Face wash */
        .icon:nth-child(2) {
            animation-delay: 3s;
            color: var(--c2);
        }

        /* Hamburger */
        .icon:nth-child(3) {
            animation-delay: 6s;
            color: var(--c3);
        }

        /* Dress */
        .icon:nth-child(4) {
            animation-delay: 9s;
            color: var(--c4);
        }

        /* Grocery bag */
        .icon:nth-child(5) {
            animation-delay: 12s;
            color: var(--c5);
        }

        .industry-label {
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--ink);
            height: 1.2rem;
            position: relative;
            width: 320px;
            text-align: center;
        }

        .typed-label {
            display: inline-block;
            white-space: nowrap;
            border-right: 2px solid var(--ink);
            padding-right: 4px;
            min-height: 1.2rem;
            animation: caretBlink 0.9s steps(1, end) infinite;
        }

        @keyframes iconFlow {
            0%, 4% {
                opacity: 0;
                transform: translateY(8px) scale(0.92);
            }
            6%, 16% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            20%, 100% {
                opacity: 0;
                transform: translateY(-6px) scale(1.03);
            }
        }

        @keyframes caretBlink {
            0%, 45% { border-right-color: var(--ink); }
            46%, 100% { border-right-color: transparent; }
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <div class="animation-frame">
            <svg class="industry-icons" viewBox="0 0 220 220" aria-label="Animated industry icons">
                
                <!-- Stethoscope (filled symbol) -->
                <g class="icon" fill="currentColor">
                    <circle cx="72" cy="30" r="7"/>
                    <circle cx="148" cy="30" r="7"/>
                    <rect x="69" y="36" width="6" height="26" rx="3"/>
                    <rect x="145" y="36" width="6" height="26" rx="3"/>
                    <path d="M70 60 Q70 114 103 138 L109 129 Q84 110 84 60 Z"/>
                    <path d="M150 60 Q150 114 117 138 L111 129 Q136 110 136 60 Z"/>
                    <rect x="107" y="132" width="6" height="26" rx="3"/>
                    <circle cx="110" cy="172" r="21"/>
                    <circle cx="110" cy="172" r="12" fill="#ffffff"/>
                    <circle cx="110" cy="172" r="5"/>
                </g>

                <!-- Face wash (filled symbol) -->
                <g class="icon" fill="currentColor">
                    <rect x="101" y="22" width="18" height="11" rx="3"/>
                    <rect x="106" y="32" width="8" height="14" rx="3"/>
                    <rect x="93" y="40" width="34" height="8" rx="4"/>
                    <rect x="84" y="41" width="11" height="6" rx="3"/>
                    <path d="M82 64 C82 52, 92 47, 104 47 H116 C128 47, 138 52, 138 64 V175 C138 186, 126 194, 110 194 C94 194, 82 186, 82 175 Z"/>
                    <rect x="90" y="95" width="40" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>
                    <rect x="90" y="108" width="40" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>
                    <rect x="90" y="121" width="30" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>
                    <circle cx="90" cy="54" r="3.5" fill="currentColor" opacity="0.9"/>
                    <circle cx="85" cy="60" r="2.5" fill="currentColor" opacity="0.75"/>
                </g>

                <!-- Hamburger (filled symbol) -->
                <g class="icon" fill="currentColor">
                    <path d="M44 106 Q44 62 110 62 Q176 62 176 106 Z"/>
                    <ellipse cx="82" cy="82" rx="4" ry="2.4" fill="#ffe1bf"/>
                    <ellipse cx="110" cy="77" rx="4" ry="2.4" fill="#ffe1bf"/>
                    <ellipse cx="138" cy="82" rx="4" ry="2.4" fill="#ffe1bf"/>
                    <rect x="44" y="110" width="132" height="8" rx="4" fill="#7ecf7c"/>
                    <rect x="44" y="118" width="132" height="17" rx="8" fill="#9a5b2f"/>
                    <rect x="44" y="135" width="132" height="11" rx="5" fill="#ffd166"/>
                    <path d="M44 146 H176 V155 Q176 167 110 167 Q44 167 44 155 Z"/>
                </g>

                <!-- Dress (filled symbol) -->
                <g class="icon" fill="currentColor">
                    <path d="M86 44 Q110 58 134 44 L142 69 Q139 92 132 112 Q156 148 182 186 Q150 202 110 202 Q70 202 38 186 Q64 148 88 112 Q81 92 78 69 Z"/>
                    <circle cx="110" cy="77" r="3" fill="#ffffff" opacity="0.95"/>
                    <circle cx="110" cy="90" r="3" fill="#ffffff" opacity="0.95"/>
                    <circle cx="110" cy="103" r="3" fill="#ffffff" opacity="0.95"/>
                    <path d="M52 181 Q74 194 96 188 Q110 184 124 188 Q146 194 168 181" fill="#ffffff" opacity="0.28"/>
                </g>

                <!-- Shopping bag (filled symbol) -->
                <g class="icon" fill="currentColor">
                    <path d="M64 82 H156 L166 186 Q166 194 158 194 H62 Q54 194 54 186 Z"/>
                    <path d="M84 82 Q84 42 110 42 Q136 42 136 82 Z"/>
                    <path d="M94 82 Q94 57 110 57 Q126 57 126 82 Z" fill="#ffffff"/>
                    <rect x="84" y="84" width="6" height="22" rx="3"/>
                    <rect x="130" y="84" width="6" height="22" rx="3"/>
                    <rect x="64" y="100" width="92" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
                    <rect x="77" y="118" width="66" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
                    <rect x="77" y="135" width="66" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
                </g>

            </svg>
        </div>

        <div class="industry-label" aria-live="polite">
            <span class="typed-label" id="typedLabel">healthcare</span>
        </div>
    </div>

    <script>
        const words = [
            "healthcare",
            "beauty & wellness",
            "hospitality & restaurants",
            "fashion",
            "retail"
        ];

        const typedLabel = document.getElementById("typedLabel");
        const cycleMs = 3000;
        const typeMs = 65;
        let wordIndex = 0;

        function typeWord(word, done) {
            typedLabel.textContent = "";
            let i = 0;

            const typer = setInterval(() => {
                i += 1;
                typedLabel.textContent = word.slice(0, i);

                if (i >= word.length) {
                    clearInterval(typer);
                    done();
                }
            }, typeMs);
        }

        function runTypeCycle() {
            const currentWord = words[wordIndex];
            typeWord(currentWord, () => {
                const usedTime = currentWord.length * typeMs;
                const waitTime = Math.max(200, cycleMs - usedTime);

                setTimeout(() => {
                    wordIndex = (wordIndex + 1) % words.length;
                    runTypeCycle();
                }, waitTime);
            });
        }

        runTypeCycle();
    </script>
</body>
</html>
